<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=trio" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=trio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Orbio — CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        // The personal appearance picker (Settings → Aparência) only applies inside
        // the logged-in workspace (/app/*). The public marketing site (/, /obrigado,
        // /privacidade) always keeps the fixed brand look, regardless of what a
        // visitor previously customized while logged in on this same browser.
        if (location.pathname.startsWith("/app")) {
          const raw = localStorage.getItem("orbio-theme-twenty");
          if (raw) {
            const parsed = JSON.parse(raw);
            const s = parsed.state || parsed;
            if (s.theme) document.documentElement.dataset.theme = s.theme;
            if (s.accent) document.documentElement.style.setProperty("--accent", s.accent);
            if (s.fontFamily) {
              document.documentElement.style.setProperty("--font-sans", s.fontFamily);
              document.documentElement.style.setProperty("--font-body", s.fontFamily);
            }
            if (s.inkColor) document.documentElement.style.setProperty("--ink-override", s.inkColor);
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
